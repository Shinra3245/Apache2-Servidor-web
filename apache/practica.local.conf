<VirtualHost *:80>
    ServerName practica.local

    DocumentRoot /var/www/practica/app

    <Directory /var/www/practica/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/www/practica/logs/error.log
    CustomLog /var/www/practica/logs/access.log combined
</VirtualHost>
